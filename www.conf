[www]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process manager
pm = dynamic
pm.max_children = 16       ; total max children
pm.start_servers = 4       ; spawn initially
pm.min_spare_servers = 2   ; idle children to keep ready
pm.max_spare_servers = 6   ; max idle children

; Prevent runaway requests
pm.max_requests = 500
request_terminate_timeout = 600s
request_slowlog_timeout = 10s
slowlog = /var/log/php8.3-fpm-slow.log

; Optional status
pm.status_path = /fpm-status